name: Build desktop downloads
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: desktop-releases-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  cancel_superseded:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Cancel older unfinished desktop builds
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs?branch=main&per_page=20" --jq ".workflow_runs[] | select(.name == \"Build desktop downloads\" and .id < $CURRENT_RUN and (.status == \"in_progress\" or .status == \"queued\")) | .id" | while read -r run; do
            gh api --method POST "repos/$GH_REPO/actions/runs/$run/cancel" || true
          done
  build:
    needs: cancel_superseded
    if: always() && !cancelled()
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows-x64
          - os: ubuntu-22.04
            label: Linux-x64
          - os: macos-15-intel
            label: macOS-Intel
          - os: macos-15
            label: macOS-AppleSilicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set packaged version
        shell: bash
        env:
          APP_PLATFORM: ${{ matrix.label }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          python - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          version = os.environ['REF_NAME'].removeprefix('v') if os.environ['REF_TYPE'] == 'tag' else '1.1.' + os.environ['RUN_NUMBER']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          Path('app_version.py').write_text('VERSION = ' + repr(version) + '\nBUILD_LABEL = ' + repr(os.environ['APP_PLATFORM']) + '\n')
          PYTHON
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk ffmpeg xvfb
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Tests
        timeout-minutes: 5
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            xvfb-run -a python -m unittest discover -s tests -v
          else
            python -m unittest discover -s tests -v
          fi
      - name: Bundle desktop app
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name WorshipUploader --collect-all googleapiclient --collect-all google_auth_oauthlib --collect-all google.auth --collect-all requests_toolbelt audio_uploader.py
      - name: Bundle independent update helper
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name update-helper update_helper.py
      - name: Smoke test executable
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            dist/WorshipUploader/WorshipUploader.exe --help
            dist/WorshipUploader/WorshipUploader.exe --version
            dist/update-helper.exe --self-test
          else
            dist/WorshipUploader/WorshipUploader --help
            dist/WorshipUploader/WorshipUploader --version
            dist/update-helper --self-test
          fi
      - name: Archive
        run: python package_release.py ${{ matrix.label }}
      - name: Verify update package and extracted helper
        env:
          PYTHONPATH: .
        run: python tests/check_update_package.py release/WorshipUploader-${{ matrix.label }}.zip ${{ matrix.label }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: release/*.zip
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          RUN_NUMBER: ${{ github.run_number }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if [ "$REF_TYPE" = "tag" ]; then
            TAG="$REF_NAME"
          else
            TAG="v1.1.$RUN_NUMBER"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" downloads/*.zip --clobber
            exit 0
          fi
          gh release create "$TAG" downloads/*.zip --target "$COMMIT_SHA" --title "Worship Audio Uploader $TAG" --notes 'Neu: Jetzt aktualisieren und neu starten lädt das passende GitHub-Paket, prüft SHA-256, ersetzt die App und startet sie neu. Bei fehlgeschlagenem Start wird die alte Version wiederhergestellt. Anmeldung, Einstellungen und eigene Dateien bleiben erhalten. Diese Version einmalig installieren, danach sind Updates direkt in der App möglich. Windows, Linux und beide Macs; FFmpeg separat erforderlich.'
